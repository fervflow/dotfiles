[general]
live_config_reload = true
working_directory = "None"

# Import order:
# 1. Active light/dark theme.
# 2. Personal color overrides.
# 3. Keyboard bindings.
#
# Missing imports are intentionally tolerated; the installer creates
# active-theme.toml before Alacritty is used.
import = [
    "~/.config/alacritty/active-theme.toml",
    "~/.config/alacritty/theme-overrides.toml",
    "~/.config/alacritty/keyboard.toml"
]

[env]
# TERM = "xterm-256color"
# WINIT_X11_SCALE_FACTOR = "1"

[window]
dynamic_padding = true
decorations = "full"
title = "Alacritty@ferv"
opacity = 0.82
blur = false
# Follow the system decoration variant.
decorations_theme_variant = "None"

[window.dimensions]
columns = 148
lines = 32

[window.class]
instance = "Alacritty"
general = "Alacritty"

[scrolling]
history = 20000
multiplier = 6

# BELL
[bell]
animation = "EaseOutExpo"
duration = 0

# FONT
[font]
size = 11
builtin_box_drawing = true

[font.normal]
#family = "CaskaydiaCove NF"
family = "JetBrainsMono Nerd Font"
style = "Medium"

[font.bold]
#family = "CaskaydiaCove NF"
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
#family = "CaskaydiaCove NF"
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
#family = "CaskaydiaCove NF"
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0
y = 0

# SELECTION
[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = false

# CURSOR
[cursor]
vi_mode_style = "None"
blink_interval = 650
blink_timeout = 10
unfocused_hollow = true
thickness = 0.3

[cursor.style]
shape = "Beam"
blinking = "On"

# MOUSE
[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"

